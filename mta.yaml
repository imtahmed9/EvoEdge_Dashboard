_schema-version: 3.3.0
ID: EvoEdge_Dashboard
description: A simple CAP project.
version: 1.0.1

modules:
  - name: EvoEdge_Dashboard-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: postgresdb
      - name: EvoEdge_Dashboard-destination-service
      - name: xsuaa-service
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      disk-quota: 1024M
      memory: 1024M
    build-parameters:
      builder: custom
      commands:
        - npm install --omit=dev

  - name: postgresdb-deployer
    type: nodejs
    path: gen/pg
    requires:
      - name: postgresdb
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      tasks:
        - command: npm start
          name: deploy-to-postgresql

  - name: comevoedgemachinerealtimemonitoringdashboard
    type: html5
    path: app/machine_real_time_monitoring_dashboard
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  - name: EvoEdge_Dashboard-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: EvoEdge_Dashboard-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - comevoedgemachinerealtimemonitoringdashboard.zip
          name: comevoedgemachinerealtimemonitoringdashboard
          target-path: resources/

  - name: EvoEdge_Dashboard
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: xsuaa-service
      - name: EvoEdge_Dashboard-destination-service
      - name: EvoEdge_Dashboard-html5-runtime
      - name: mtx-api
        group: destinations
        properties:
          name: mtx-api
          url: ~{mtx-url}
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}
    properties:
      TENANT_HOST_PATTERN: "^(.*)-${default-uri}"

  - name: EvoEdge_Dashboard-destinations
    type: com.sap.application.content
    requires:
      - name: EvoEdge_Dashboard-auth
        parameters:
          service-key:
            name: EvoEdge_Dashboard-auth-key
      - name: EvoEdge_Dashboard-html5-repo-host
        parameters:
          service-key:
            name: EvoEdge_Dashboard-html5-repo-host-key
      - name: srv-api
      - name: EvoEdge_Dashboard-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: EvoEdge_Dashboard-html5-repository
              ServiceInstanceName: EvoEdge_Dashboard-html5-repo-host
              ServiceKeyName: EvoEdge_Dashboard-html5-repo-host-key
              sap.cloud.service: EvoEdge_Dashboard.service
            - Name: EvoEdge_Dashboard-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: EvoEdge_Dashboard-auth
              ServiceKeyName: EvoEdge_Dashboard-auth-key
              sap.cloud.service: EvoEdge_Dashboard.service

  - name: EvoEdge_Dashboard-mtx
    type: nodejs
    path: gen/mtx/sidecar
    build-parameters:
      builder: custom
      commands:
        - npm install --omit=dev
    parameters:
      instances: 1
      memory: 256M
      disk-quota: 512M
    provides:
      - name: mtx-api
        properties:
          mtx-url: ${default-url}
    requires:
      - name: EvoEdge_Dashboard-registry
      - name: app-api
        properties:
          SUBSCRIPTION_URL: ~{app-protocol}://\${tenant_subdomain}-~{app-uri}
      - name: EvoEdge_Dashboard-destination-service
      - name: EvoEdge_Dashboard-html5-runtime
      - name: EvoEdge_Dashboard-repo-host
      - name: xsuaa-service

resources:
  - name: xsuaa-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: EvoEdge_Dashboard_EvoedgeSolutionsLimited_Dev
        tenant-mode: shared
        oauth2-configuration:
          redirect-uris:
            - https://~{app-api/app-uri}/**
    requires:
      - name: app-api

  - name: postgresdb
    type: org.cloudfoundry.managed-service
    parameters:
      service: postgresql-db
      service-name: postgresdb
      service-plan: standard

  - name: EvoEdge_Dashboard-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: EvoEdge_Dashboard-html5-service
      service-plan: app-host

  - name: EvoEdge_Dashboard-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  - name: EvoEdge_Dashboard-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  - name: EvoEdge_Dashboard-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-name: EvoEdge_Dashboard-destination-service
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
          subaccount:
            existing_destinations_policy: update
            destinations:
              - Name: EvoEdge_Dashboard-workzone-runtime
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                URL: https://${org}.launchpad.${default-domain}
                CEP.HTML5contentprovider: true
        version: 1.0.0
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

  - name: EvoEdge_Dashboard-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      existing-service-name: EvoEdge_Dashboard-auth

  - name: EvoEdge_Dashboard-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: EvoEdge_Dashboard-registry
    type: org.cloudfoundry.managed-service
    requires:
      - name: mtx-api
    parameters:
      service: saas-registry
      service-plan: application
      config:
        xsappname: EvoEdge_Dashboard_EvoedgeSolutionsLimited_Dev
        appName: EvoEdge_Dashboard_EvoedgeSolutionsLimited_Dev
        displayName: EvoEdge_Dashboard
        description: A simple CAP project.
        category: 'Category'
        appUrls:
          getDependencies: ~{mtx-api/mtx-url}/-/cds/saas-provisioning/dependencies
          onSubscription: ~{mtx-api/mtx-url}/-/cds/saas-provisioning/tenant/{tenantId}
          onSubscriptionAsync: true
          onUnSubscriptionAsync: true
          onUpdateDependenciesAsync: true
          callbackTimeoutMillis: 300000

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npx cds build --production
